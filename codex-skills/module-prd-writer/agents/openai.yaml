interface:
  display_name: "模块 PRD 生成器"
  short_description: "既能梳理业务出评审稿，也能补齐到研发可直接开发、评估工期并沉淀飞书文档和甘特图的模块级 PRD"
  default_prompt: "使用 $module-prd-writer。先判断用户要的是评审讨论版、研发开发版还是评审兼落地版；默认按精简落地稿输出，先保证一眼能扫结构、研发能抓重点、测试能找验收。功能需求明细必须按模块展开，但每个模块默认用 3 张核心表承载：字段/配置/展示、按钮/动作、规则/异常/验收；不要机械拆成多张近义表，不要输出空表头，不要为统计页或纯配置页硬凑筛选区/列表区。如果用户明确说给研发开发/测试验收/研发交付版/按模块写细，再补全真实存在的筛选项、字段、按钮、规则、交互、状态异常和验收口径。信息不足时也要给带示例行和 TBD 的骨架版。信息稳定后默认先 dry-run，再同步为飞书 PRD 文档。若用户给了工期、里程碑、版本节奏，或明确要求工作量评估/甘特图，则在 PRD 定稿后继续补模块工作量评估，并先 dry-run 再用飞书多维表格生成开发甘特图。"
