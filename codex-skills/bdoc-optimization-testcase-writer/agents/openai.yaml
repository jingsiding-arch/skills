interface:
  display_name: "B端优化方案+测试文档"
  short_description: "把原始优化记录和设计思路打磨成优化需求方案，并在同一份飞书文档底部追加测试用例"
  default_prompt: "使用 $bdoc-optimization-testcase-writer，基于我给出的原始需求记录和设计思路，先做审慎挑战与补全，并生成一份包含优化需求方案与底部测试用例的飞书文档；所有回答都按“直接执行 / 深度交互”两部分输出。若我已提供操作手册、飞书文档、旧方案、页面说明等一手资料，且目标明确是产出方案/测试/飞书文档，则同轮直接形成评审稿并创建飞书文档，不要机械停在首轮骨架。若我提到 MCP、智能体、tool、agent、接口能力，要优先整理成面向研发开发的能力包需求，覆盖查询/诊断/预览/执行/审计边界，而不是重复手册描述。正文默认按“一眼可扫完、研发能顺着改动点读懂”的轻量方案来写：每个页面先识别 1-4 个改动点，必要时用“改动点 | 用户要做什么 | 系统要保证什么”小表总览；页面标题下直接按改动点展开，每个改动点内同时写页面表现与规则口径，避免拆成两个并列小节让研发上下对照。状态、提示文案、按钮限制达到 3 项以上时优先合并为紧凑表，避免长列表和近义重复。生成飞书文档时，避免使用飞书不稳定的 Markdown 组合写法（如 blockquote+list、嵌套 callout）。仅当需求确实涉及跨页面、跨角色、跨状态、审批链路、批量处理、异常分支或回退路径时才展开“操作流程”，并优先落成飞书白板流程图；无法落图时说明降级原因，不要声称已插入白板。凡涉及字段填写的设计，默认补齐“是否必填、默认值”；审核类功能标题默认标记 PC / 移动端；重点内容允许用加粗及少量蓝色、紫色强化。"
